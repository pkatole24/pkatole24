  <title id="title">Paarth Katole — AI Systems / Analytics / Forecasting</title>
  <desc id="description">UCLA MSBA · IIT Bombay. I work across AI systems, analytics, and forecasting. I like the part where a model becomes something you actually use and the questions that come up when the data refuses to cooperate. Toolbox: AI systems — LangGraph, LangChain, RAG / vector search, LLM APIs. Analytics — Python, SQL, R, Tableau, Power BI. Forecasting and modeling — scikit-learn, XGBoost / LightGBM. Pipelines and platforms — PySpark, dbt, Airflow, BigQuery, Snowflake. Exploration and delivery — Jupyter, Streamlit, Git.</desc>
